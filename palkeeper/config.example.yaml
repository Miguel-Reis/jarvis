# Configuração do PalKeeper (copiar para config.yaml)
# Secrets (passwords, tokens) vão SEMPRE por variáveis de ambiente:
#   PALWORLD_ADMIN_PASSWORD  — AdminPassword do servidor Palworld
#   PELICAN_API_KEY          — Client API key do Pelican Panel
#   PALKEEPER_API_TOKEN      — token da API interna do PalKeeper
#   DISCORD_WEBHOOK_URL      — webhook do canal Discord (opcional)

timezone: Europe/Lisbon
logLevel: info

database:
  path: /data/palkeeper.db

palworld:
  restUrl: http://127.0.0.1:8212
  rcon:
    enabled: true
    host: 127.0.0.1
    port: 25575
  # Pasta Pal/Saved do servidor, montada read/write no container
  savedPath: /palworld/Saved
  requestTimeoutMs: 10000
  maxRetries: 3
  circuitBreaker:
    failureThreshold: 5
    cooldownSeconds: 30

pelican:
  enabled: true
  url: https://painel.example.com
  # Identificador curto do servidor (visível no URL do painel)
  serverId: "abc123ef"

autosave:
  enabled: true
  intervalMinutes: 15

backup:
  enabled: true
  path: /data/backups
  keep: 48

restart:
  enabled: true
  cron: "0 6 * * *" # todos os dias às 06:00 (Europe/Lisbon)
  countdownMinutes: [10, 5, 2, 1]
  serverReturnTimeoutMinutes: 15

# Tracking de sessões (playtime, primeira/última visita) via polling de /players
sessions:
  enabled: true
  pollIntervalSeconds: 15

# Announce de boas-vindas ao entrar (mensagem especial na primeira visita)
welcome:
  enabled: true
  delaySeconds: 5

# Watchdog do memory leak: RAM do processo OU FPS baixos sustentados → restart
watchdog:
  enabled: false
  checkIntervalSeconds: 60
  memoryLimitMB: 28000        # ajusta à RAM do host
  fpsThreshold: 15
  sustainedMinutes: 5         # a condição tem de se manter este tempo
  cooldownMinutes: 30         # intervalo mínimo entre restarts do watchdog
  countdownMinutes: [5, 2, 1]
  processName: PalServer      # procurado no /proc do host
  procPath: /host/proc        # monta "- /proc:/host/proc:ro" no compose

# Modo whitelist: quem não estiver na whitelist é kickado
# (gerir via API: GET/POST/DELETE /whitelist)
moderation:
  whitelistEnabled: false

# Mensagens periódicas rotativas
motd:
  enabled: false
  intervalMinutes: 30
  onlyWhenPlayersOnline: true
  messages:
    - "Dica: usa /save antes de sair de zona perigosa!"
    - "Junta-te ao nosso Discord!"

# Top playtime publicado por announce e Discord
leaderboard:
  enabled: false
  cron: "0 21 * * 0" # domingos às 21:00
  top: 5
  period: weekly # weekly | monthly

# Notificações Discord por webhook (DISCORD_WEBHOOK_URL via env)
discord:
  enabled: false
  dailySummaryCron: "59 23 * * *"
  notify:
    joinLeave: true
    backups: true
    watchdog: true
    serverStatus: true
    restarts: true
    dailySummary: true

api:
  port: 8300
  host: 0.0.0.0

# Mensagens visíveis aos jogadores (PT-PT).
# Nota: o announce do Palworld não suporta acentos de forma fiável em todos
# os clientes — mantém as mensagens em ASCII simples se vires caracteres partidos.
messages:
  restartWarning: "[PalKeeper] O servidor reinicia em {minutes} min!"
  restartNow: "[PalKeeper] O servidor vai reiniciar AGORA. Ate ja!"
  restartDone: "[PalKeeper] Servidor de volta. Bom jogo!"
  welcome: "Bem-vindo de volta, {name}!"
  welcomeFirst: "Bem-vindo ao servidor, {name}! Diverte-te!"
  kickNotWhitelisted: "Nao estas na whitelist deste servidor."
