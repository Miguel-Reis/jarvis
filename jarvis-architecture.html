<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis Architecture</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e1a;
    --surface: #0f1420;
    --surface2: #151c2e;
    --surface3: #1a2236;
    --accent: #4da6ff;
    --text: #e2e8f0;
    --text-muted: #64748b;
    --border: #1e2d4a;
    --shadow: 0 4px 24px rgba(0,0,0,0.5);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }

  /* ── Top Bar ── */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 52px;
    background: linear-gradient(90deg, #0d1525 0%, #111827 50%, #0d1525 100%);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px;
    box-shadow: var(--shadow);
  }
  #topbar .logo {
    display: flex; align-items: center; gap: 10px;
  }
  #topbar .logo-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, #4da6ff 0%, #8b5cf6 100%);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 900; color: #fff;
  }
  #topbar h1 {
    font-size: 17px; font-weight: 700;
    background: linear-gradient(90deg, #4da6ff, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: -0.3px;
  }
  #topbar .stats {
    display: flex; gap: 20px; margin-left: 24px;
  }
  #topbar .stat {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-muted);
  }
  #topbar .stat strong {
    color: var(--accent); font-weight: 600;
  }
  #topbar .sep {
    width: 1px; height: 24px; background: var(--border);
  }
  #topbar .controls {
    margin-left: auto; display: flex; gap: 8px;
  }
  #topbar button {
    padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text-muted);
    font-size: 12px; cursor: pointer; transition: all 0.15s;
  }
  #topbar button:hover {
    background: var(--surface3); color: var(--text); border-color: var(--accent);
  }

  /* ── Layout ── */
  #layout {
    position: fixed;
    top: 52px; left: 0; right: 0; bottom: 0;
    display: flex;
  }

  /* ── Left Panel ── */
  #sidebar {
    width: 220px; flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  #sidebar-header {
    padding: 14px 16px 10px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    color: var(--text-muted); text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }
  #layer-list {
    flex: 1; overflow-y: auto; padding: 8px;
  }
  #layer-list::-webkit-scrollbar { width: 4px; }
  #layer-list::-webkit-scrollbar-track { background: transparent; }
  #layer-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .layer-item {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 10px; border-radius: 7px; cursor: pointer;
    transition: background 0.12s; margin-bottom: 2px;
    user-select: none;
  }
  .layer-item:hover { background: var(--surface2); }
  .layer-item.active { background: var(--surface3); }
  .layer-item.dimmed { opacity: 0.4; }
  .layer-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .layer-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .layer-count {
    margin-left: auto; font-size: 11px; color: var(--text-muted);
    background: var(--surface); padding: 1px 6px; border-radius: 10px;
  }
  .layer-item.active .layer-count { background: var(--surface2); }

  #sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    font-size: 11px; color: var(--text-muted); line-height: 1.6;
  }
  #sidebar-footer kbd {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 3px; padding: 1px 4px; font-size: 10px;
    color: var(--text); font-family: monospace;
  }

  /* ── Canvas ── */
  #canvas-wrapper {
    flex: 1; position: relative; overflow: hidden;
  }
  #graph-svg {
    width: 100%; height: 100%;
    cursor: grab;
  }
  #graph-svg:active { cursor: grabbing; }

  /* D3 graph styles */
  .link {
    fill: none;
    stroke-opacity: 0.35;
    transition: stroke-opacity 0.2s;
  }
  .link.highlighted { stroke-opacity: 0.9 !important; stroke-width: 2px !important; }
  .link.dimmed { stroke-opacity: 0.04 !important; }

  .node-group { cursor: pointer; }
  .node-circle {
    stroke-width: 2;
    transition: filter 0.15s;
  }
  .node-group:hover .node-circle {
    filter: brightness(1.3) drop-shadow(0 0 8px currentColor);
  }
  .node-group.dimmed .node-circle { opacity: 0.15; }
  .node-group.dimmed .node-label { opacity: 0.1; }
  .node-group.highlighted .node-circle {
    filter: brightness(1.4) drop-shadow(0 0 12px currentColor);
  }

  .node-label {
    font-size: 10.5px;
    font-weight: 600;
    fill: #e2e8f0;
    text-anchor: middle;
    pointer-events: none;
    paint-order: stroke;
    stroke: #0a0e1a;
    stroke-width: 3px;
    stroke-linejoin: round;
  }

  /* ── Tooltip ── */
  #tooltip {
    position: fixed;
    background: #0f1928;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 15px;
    min-width: 220px; max-width: 300px;
    pointer-events: none;
    z-index: 1000;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.15s, transform 0.15s;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }
  #tooltip.visible { opacity: 1; transform: translateY(0); }
  #tooltip .tt-layer {
    font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; margin-bottom: 4px;
  }
  #tooltip .tt-name {
    font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 3px;
  }
  #tooltip .tt-desc {
    font-size: 12px; color: #94a3b8; margin-bottom: 8px; line-height: 1.5;
  }
  #tooltip .tt-path {
    font-size: 10.5px; color: #4da6ff;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    background: rgba(77,166,255,0.08);
    padding: 4px 8px; border-radius: 5px;
    border: 1px solid rgba(77,166,255,0.15);
    word-break: break-all;
  }
  #tooltip .tt-connections {
    margin-top: 8px; font-size: 11px; color: var(--text-muted);
  }
  #tooltip .tt-connections span { color: var(--accent); font-weight: 600; }

  /* ── Info panel (click) ── */
  #info-panel {
    position: fixed; right: 0; top: 52px; bottom: 0;
    width: 260px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    transform: translateX(100%);
    transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
    z-index: 50;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  #info-panel.open { transform: translateX(0); }
  #info-panel-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  #info-panel-header .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  #info-panel-header h3 { font-size: 14px; font-weight: 700; flex: 1; }
  #info-panel-close {
    background: none; border: none; color: var(--text-muted);
    font-size: 18px; cursor: pointer; padding: 2px 4px; border-radius: 4px;
    transition: color 0.1s;
  }
  #info-panel-close:hover { color: var(--text); }
  #info-panel-body { padding: 14px 16px; overflow-y: auto; flex: 1; }
  #info-panel-body::-webkit-scrollbar { width: 4px; }
  #info-panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .info-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 4px; margin-top: 14px; }
  .info-label:first-child { margin-top: 0; }
  .info-value { font-size: 13px; color: var(--text); line-height: 1.5; }
  .info-path {
    font-size: 11px; color: #4da6ff; font-family: monospace;
    background: rgba(77,166,255,0.08); padding: 5px 8px; border-radius: 5px;
    border: 1px solid rgba(77,166,255,0.15); word-break: break-all;
  }
  .info-connections { display: flex; flex-direction: column; gap: 4px; }
  .info-conn {
    display: flex; align-items: center; gap: 6px;
    font-size: 11.5px; padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .conn-arrow { color: var(--text-muted); font-size: 10px; }
  .conn-target { color: var(--text); }
  .conn-in { color: #10b981; }
  .conn-out { color: var(--accent); }

  /* ── Zoom controls ── */
  #zoom-controls {
    position: fixed; right: 16px; bottom: 20px;
    display: flex; flex-direction: column; gap: 4px;
    z-index: 60;
  }
  .zoom-btn {
    width: 36px; height: 36px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; cursor: pointer; color: var(--text-muted);
    font-size: 18px; display: flex; align-items: center; justify-content: center;
    transition: all 0.12s;
  }
  .zoom-btn:hover { background: var(--surface3); color: var(--text); border-color: var(--accent); }

  /* ── Search ── */
  #search-box {
    position: fixed; top: 64px; right: 16px; z-index: 80;
    display: flex; gap: 6px; align-items: center;
  }
  #search-input {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 12px; color: var(--text);
    font-size: 12.5px; width: 180px; outline: none;
    transition: border-color 0.15s;
  }
  #search-input:focus { border-color: var(--accent); }
  #search-input::placeholder { color: var(--text-muted); }

  /* ── Gradient background ── */
  #bg-glow {
    position: fixed; pointer-events: none; z-index: 0;
    top: 52px; left: 220px; right: 0; bottom: 0;
    background: radial-gradient(ellipse at 30% 40%, rgba(77,166,255,0.035) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 60%, rgba(139,92,246,0.03) 0%, transparent 55%);
  }

  /* ── Mini stats overlay ── */
  #mini-stats {
    position: fixed; left: 230px; bottom: 14px;
    display: flex; gap: 16px; z-index: 60;
    pointer-events: none;
  }
  .mini-stat {
    font-size: 11px; color: var(--text-muted);
  }
  .mini-stat strong { color: var(--text); }
</style>
</head>
<body>

<!-- Top Bar -->
<div id="topbar">
  <div class="logo">
    <div class="logo-icon">J</div>
    <h1>Jarvis Architecture</h1>
  </div>
  <div class="sep"></div>
  <div class="stats">
    <div class="stat"><strong>314</strong> source files</div>
    <div class="stat"><strong>19</strong> subsystems</div>
    <div class="stat"><strong>74</strong> nodes</div>
    <div class="stat"><strong>101</strong> edges</div>
  </div>
  <div class="controls">
    <button id="btn-reset-zoom">Reset View</button>
    <button id="btn-all-layers">All Layers</button>
  </div>
</div>

<!-- Background glow -->
<div id="bg-glow"></div>

<!-- Layout -->
<div id="layout">
  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-header">Layers</div>
    <div id="layer-list"></div>
    <div id="sidebar-footer">
      <div style="margin-bottom:6px"><kbd>Scroll</kbd> zoom &nbsp; <kbd>Drag</kbd> pan</div>
      <div><kbd>Click</kbd> node to inspect</div>
    </div>
  </div>

  <!-- Canvas -->
  <div id="canvas-wrapper">
    <svg id="graph-svg"></svg>
  </div>
</div>

<!-- Tooltip -->
<div id="tooltip">
  <div class="tt-layer" id="tt-layer"></div>
  <div class="tt-name" id="tt-name"></div>
  <div class="tt-desc" id="tt-desc"></div>
  <div class="tt-path" id="tt-path"></div>
  <div class="tt-connections" id="tt-connections"></div>
</div>

<!-- Info Panel -->
<div id="info-panel">
  <div id="info-panel-header">
    <div class="dot" id="ip-dot"></div>
    <h3 id="ip-name">—</h3>
    <button id="info-panel-close">×</button>
  </div>
  <div id="info-panel-body">
    <div class="info-label">Layer</div>
    <div class="info-value" id="ip-layer">—</div>
    <div class="info-label">Description</div>
    <div class="info-value" id="ip-desc">—</div>
    <div class="info-label">File Path</div>
    <div class="info-path" id="ip-path">—</div>
    <div class="info-label">Outgoing Connections</div>
    <div class="info-connections" id="ip-out"></div>
    <div class="info-label">Incoming Connections</div>
    <div class="info-connections" id="ip-in"></div>
  </div>
</div>

<!-- Search -->
<div id="search-box">
  <input id="search-input" type="text" placeholder="Search node…" autocomplete="off">
</div>

<!-- Zoom controls -->
<div id="zoom-controls">
  <button class="zoom-btn" id="btn-zoom-in">+</button>
  <button class="zoom-btn" id="btn-zoom-out">−</button>
  <button class="zoom-btn" id="btn-zoom-fit" title="Fit" style="font-size:13px">⊡</button>
</div>

<!-- Mini stats -->
<div id="mini-stats">
  <div class="mini-stat" id="zoom-level">Zoom: 100%</div>
</div>

<script>
// ═══════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════

// ═══════════════════════════════════════════════════
// SETUP
// ═══════════════════════════════════════════════════

const nodeMap = Object.fromEntries(NODES.map(n => [n.id, n]));

// Build adjacency for connection counts
const outEdges = {}, inEdges = {};
NODES.forEach(n => { outEdges[n.id] = []; inEdges[n.id] = []; });
EDGES_RAW.forEach(([s, t]) => { outEdges[s].push(t); inEdges[t].push(s); });

// Layer counts
const layerCounts = {};
NODES.forEach(n => { layerCounts[n.layer] = (layerCounts[n.layer] || 0) + 1; });

// ═══════════════════════════════════════════════════
// SIDEBAR
// ═══════════════════════════════════════════════════
const layerList = document.getElementById('layer-list');
let activeFilters = new Set(LAYERS.map(l => l.id)); // all active by default

LAYERS.forEach(layer => {
  const item = document.createElement('div');
  item.className = 'layer-item active';
  item.dataset.layer = layer.id;
  item.innerHTML = `
    <div class="layer-dot" style="background:${layer.color}"></div>
    <span class="layer-name">${layer.label}</span>
    <span class="layer-count">${layerCounts[layer.id] || 0}</span>
  `;
  item.addEventListener('click', () => toggleLayer(layer.id, item));
  layerList.appendChild(item);
});

function toggleLayer(layerId, el) {
  if (activeFilters.has(layerId)) {
    if (activeFilters.size === 1) return; // keep at least one
    activeFilters.delete(layerId);
    el.classList.remove('active');
    el.classList.add('dimmed');
  } else {
    activeFilters.add(layerId);
    el.classList.add('active');
    el.classList.remove('dimmed');
  }
  updateVisibility();
}

function updateVisibility() {
  nodeGroups.each(function(d) {
    const visible = activeFilters.has(d.layer);
    d3.select(this)
      .transition().duration(200)
      .style('opacity', visible ? 1 : 0)
      .style('pointer-events', visible ? 'all' : 'none');
  });
  linkEls.each(function(d) {
    const srcOk = activeFilters.has(nodeMap[d.source.id || d.source]?.layer);
    const tgtOk = activeFilters.has(nodeMap[d.target.id || d.target]?.layer);
    d3.select(this)
      .transition().duration(200)
      .style('opacity', (srcOk && tgtOk) ? 1 : 0);
  });
}

document.getElementById('btn-all-layers').addEventListener('click', () => {
  activeFilters = new Set(LAYERS.map(l => l.id));
  document.querySelectorAll('.layer-item').forEach(el => {
    el.classList.add('active'); el.classList.remove('dimmed');
  });
  updateVisibility();
  resetHighlight();
});

// ═══════════════════════════════════════════════════
// D3 GRAPH
// ═══════════════════════════════════════════════════

const svg = d3.select('#graph-svg');
const wrapper = document.getElementById('canvas-wrapper');

let W = wrapper.clientWidth;
let H = wrapper.clientHeight;

// Defs (arrow markers, per layer)
const defs = svg.append('defs');

LAYERS.forEach(layer => {
  defs.append('marker')
    .attr('id', `arrow-${layer.id}`)
    .attr('viewBox', '0 -4 10 8')
    .attr('refX', 18)
    .attr('refY', 0)
    .attr('markerWidth', 6)
    .attr('markerHeight', 6)
    .attr('orient', 'auto')
    .append('path')
    .attr('d', 'M0,-4L10,0L0,4')
    .attr('fill', layer.color)
    .attr('opacity', 0.7);
});

// Also add a "highlighted" marker
defs.append('marker')
  .attr('id', 'arrow-highlight')
  .attr('viewBox', '0 -4 10 8')
  .attr('refX', 18)
  .attr('refY', 0)
  .attr('markerWidth', 8)
  .attr('markerHeight', 8)
  .attr('orient', 'auto')
  .append('path')
  .attr('d', 'M0,-4L10,0L0,4')
  .attr('fill', '#fff')
  .attr('opacity', 0.9);

// Glow filter
const filter = defs.append('filter').attr('id', 'glow');
filter.append('feGaussianBlur').attr('stdDeviation', '3').attr('result', 'coloredBlur');
const feMerge = filter.append('feMerge');
feMerge.append('feMergeNode').attr('in', 'coloredBlur');
feMerge.append('feMergeNode').attr('in', 'SourceGraphic');

// Zoom
const zoom = d3.zoom()
  .scaleExtent([0.1, 4])
  .on('zoom', (event) => {
    g.attr('transform', event.transform);
    const pct = Math.round(event.transform.k * 100);
    document.getElementById('zoom-level').textContent = `Zoom: ${pct}%`;
  });

svg.call(zoom).on('dblclick.zoom', null);

const g = svg.append('g').attr('class', 'root');

// Links layer
const linkG = g.append('g').attr('class', 'links');
// Nodes layer
const nodeG = g.append('g').attr('class', 'nodes');

// Build links data
const links = EDGES_RAW.map(([s, t]) => ({ source: s, target: t }));

// Node radius
function nodeR(d) {
  return d.size === 3 ? 22 : d.size === 2 ? 15 : 10;
}

// Simulation
const simulation = d3.forceSimulation(NODES)
  .force('link', d3.forceLink(links)
    .id(d => d.id)
    .distance(d => {
      const sr = nodeR(nodeMap[d.source.id || d.source]);
      const tr = nodeR(nodeMap[d.target.id || d.target]);
      return 70 + sr + tr;
    })
    .strength(0.3))
  .force('charge', d3.forceManyBody()
    .strength(d => d.size === 3 ? -800 : d.size === 2 ? -400 : -200))
  .force('center', d3.forceCenter(W / 2, H / 2))
  .force('collision', d3.forceCollide(d => nodeR(d) + 18))
  .force('x', d3.forceX(W / 2).strength(0.04))
  .force('y', d3.forceY(H / 2).strength(0.04))
  .alphaDecay(0.025);

// Draw links
const linkEls = linkG.selectAll('path')
  .data(links)
  .join('path')
  .attr('class', 'link')
  .attr('stroke', d => LAYER_MAP[nodeMap[d.source]?.layer || nodeMap[d.source.id]?.layer]?.color || '#4da6ff')
  .attr('stroke-width', 1.2)
  .attr('marker-end', d => {
    const layer = nodeMap[d.source]?.layer || nodeMap[d.source.id]?.layer;
    return `url(#arrow-${layer})`;
  });

// Draw nodes
const nodeGroups = nodeG.selectAll('g.node-group')
  .data(NODES)
  .join('g')
  .attr('class', 'node-group')
  .call(d3.drag()
    .on('start', dragStart)
    .on('drag', dragged)
    .on('end', dragEnd));

// Node circles
nodeGroups.append('circle')
  .attr('class', 'node-circle')
  .attr('r', d => nodeR(d))
  .attr('fill', d => {
    const col = LAYER_MAP[d.layer]?.color || '#888';
    return col;
  })
  .attr('fill-opacity', 0.85)
  .attr('stroke', d => LAYER_MAP[d.layer]?.color || '#888')
  .attr('stroke-opacity', 0.6);

// Node glow ring for large nodes
nodeGroups.filter(d => d.size === 3)
  .append('circle')
  .attr('r', d => nodeR(d) + 6)
  .attr('fill', 'none')
  .attr('stroke', d => LAYER_MAP[d.layer]?.color || '#888')
  .attr('stroke-opacity', 0.25)
  .attr('stroke-width', 2)
  .attr('stroke-dasharray', '4 3')
  .style('pointer-events', 'none');

// Labels
nodeGroups.append('text')
  .attr('class', 'node-label')
  .attr('dy', d => nodeR(d) + 13)
  .text(d => d.id);

// ═══════════════════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════════════════
const tooltip = document.getElementById('tooltip');
let tooltipTimeout;

function showTooltip(event, d) {
  clearTimeout(tooltipTimeout);
  const layerColor = LAYER_MAP[d.layer]?.color || '#888';
  document.getElementById('tt-layer').textContent = d.layer;
  document.getElementById('tt-layer').style.color = layerColor;
  document.getElementById('tt-name').textContent = d.id;
  document.getElementById('tt-desc').textContent = d.desc;
  document.getElementById('tt-path').textContent = d.path;
  const outs = outEdges[d.id]?.length || 0;
  const ins = inEdges[d.id]?.length || 0;
  document.getElementById('tt-connections').innerHTML =
    `<span>${outs}</span> outgoing · <span>${ins}</span> incoming connections`;
  tooltip.classList.add('visible');
  moveTooltip(event);
}

function moveTooltip(event) {
  const x = event.clientX + 14;
  const y = event.clientY - 10;
  const tw = tooltip.offsetWidth;
  const th = tooltip.offsetHeight;
  const px = (x + tw > window.innerWidth - 10) ? x - tw - 28 : x;
  const py = (y + th > window.innerHeight - 10) ? y - th + 20 : y;
  tooltip.style.left = px + 'px';
  tooltip.style.top = py + 'px';
}

function hideTooltip() {
  tooltipTimeout = setTimeout(() => tooltip.classList.remove('visible'), 80);
}

nodeGroups
  .on('mouseenter', function(event, d) { showTooltip(event, d); })
  .on('mousemove', function(event) { moveTooltip(event); })
  .on('mouseleave', function() { hideTooltip(); });

// ═══════════════════════════════════════════════════
// CLICK — INFO PANEL + HIGHLIGHT
// ═══════════════════════════════════════════════════
let selectedNode = null;

nodeGroups.on('click', function(event, d) {
  event.stopPropagation();
  tooltip.classList.remove('visible');
  if (selectedNode === d.id) {
    // deselect
    selectedNode = null;
    resetHighlight();
    closeInfoPanel();
    return;
  }
  selectedNode = d.id;
  highlightNode(d);
  openInfoPanel(d);
});

svg.on('click', () => {
  if (selectedNode) {
    selectedNode = null;
    resetHighlight();
    closeInfoPanel();
  }
});

function highlightNode(d) {
  const connectedIds = new Set([d.id]);
  const connectedLinks = new Set();
  links.forEach((l, i) => {
    const srcId = l.source.id || l.source;
    const tgtId = l.target.id || l.target;
    if (srcId === d.id || tgtId === d.id) {
      connectedIds.add(srcId);
      connectedIds.add(tgtId);
      connectedLinks.add(i);
    }
  });

  nodeGroups.classed('highlighted', nd => nd.id === d.id)
    .classed('dimmed', nd => !connectedIds.has(nd.id));

  linkEls
    .classed('highlighted', (_, i) => connectedLinks.has(i))
    .classed('dimmed', (_, i) => !connectedLinks.has(i));
}

function resetHighlight() {
  nodeGroups.classed('highlighted', false).classed('dimmed', false);
  linkEls.classed('highlighted', false).classed('dimmed', false);
}

function openInfoPanel(d) {
  const layerColor = LAYER_MAP[d.layer]?.color || '#888';
  document.getElementById('ip-dot').style.background = layerColor;
  document.getElementById('ip-name').textContent = d.id;
  document.getElementById('ip-layer').textContent = d.layer;
  document.getElementById('ip-layer').style.color = layerColor;
  document.getElementById('ip-desc').textContent = d.desc;
  document.getElementById('ip-path').textContent = d.path;

  // Outgoing
  const outEl = document.getElementById('ip-out');
  outEl.innerHTML = '';
  (outEdges[d.id] || []).forEach(t => {
    const tNode = nodeMap[t];
    const tc = LAYER_MAP[tNode?.layer]?.color || '#888';
    outEl.innerHTML += `<div class="info-conn">
      <span class="conn-out">→</span>
      <div class="layer-dot" style="background:${tc};width:8px;height:8px;border-radius:50%;flex-shrink:0"></div>
      <span class="conn-target">${t}</span>
      <span style="margin-left:auto;font-size:10px;color:${tc}">${tNode?.layer}</span>
    </div>`;
  });
  if (!outEdges[d.id]?.length) outEl.innerHTML = '<div style="color:var(--text-muted);font-size:12px">None</div>';

  // Incoming
  const inEl = document.getElementById('ip-in');
  inEl.innerHTML = '';
  (inEdges[d.id] || []).forEach(s => {
    const sNode = nodeMap[s];
    const sc = LAYER_MAP[sNode?.layer]?.color || '#888';
    inEl.innerHTML += `<div class="info-conn">
      <span class="conn-in">←</span>
      <div class="layer-dot" style="background:${sc};width:8px;height:8px;border-radius:50%;flex-shrink:0"></div>
      <span class="conn-target">${s}</span>
      <span style="margin-left:auto;font-size:10px;color:${sc}">${sNode?.layer}</span>
    </div>`;
  });
  if (!inEdges[d.id]?.length) inEl.innerHTML = '<div style="color:var(--text-muted);font-size:12px">None</div>';

  document.getElementById('info-panel').classList.add('open');
}

function closeInfoPanel() {
  document.getElementById('info-panel').classList.remove('open');
}

document.getElementById('info-panel-close').addEventListener('click', () => {
  selectedNode = null;
  resetHighlight();
  closeInfoPanel();
});

// ═══════════════════════════════════════════════════
// CURVED PATHS
// ═══════════════════════════════════════════════════
function linkPath(d) {
  const sx = d.source.x, sy = d.source.y;
  const tx = d.target.x, ty = d.target.y;
  const dx = tx - sx, dy = ty - sy;
  const dr = Math.sqrt(dx * dx + dy * dy);
  // slight curve
  const curvature = 0.2;
  const mx = (sx + tx) / 2 - dy * curvature;
  const my = (sy + ty) / 2 + dx * curvature;
  return `M${sx},${sy} Q${mx},${my} ${tx},${ty}`;
}

// ═══════════════════════════════════════════════════
// SIMULATION TICK
// ═══════════════════════════════════════════════════
simulation.on('tick', () => {
  linkEls.attr('d', linkPath);
  nodeGroups.attr('transform', d => `translate(${d.x},${d.y})`);
});

// ═══════════════════════════════════════════════════
// DRAG
// ═══════════════════════════════════════════════════
function dragStart(event, d) {
  if (!event.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragged(event, d) {
  d.fx = event.x; d.fy = event.y;
}
function dragEnd(event, d) {
  if (!event.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}

// ═══════════════════════════════════════════════════
// ZOOM CONTROLS
// ═══════════════════════════════════════════════════
document.getElementById('btn-zoom-in').addEventListener('click', () => {
  svg.transition().duration(300).call(zoom.scaleBy, 1.4);
});
document.getElementById('btn-zoom-out').addEventListener('click', () => {
  svg.transition().duration(300).call(zoom.scaleBy, 0.7);
});
document.getElementById('btn-zoom-fit').addEventListener('click', fitView);
document.getElementById('btn-reset-zoom').addEventListener('click', fitView);

function fitView() {
  const bounds = g.node().getBBox();
  if (!bounds.width || !bounds.height) return;
  const fullW = W, fullH = H;
  const scale = 0.88 / Math.max(bounds.width / fullW, bounds.height / fullH);
  const tx = fullW / 2 - scale * (bounds.x + bounds.width / 2);
  const ty = fullH / 2 - scale * (bounds.y + bounds.height / 2);
  svg.transition().duration(600).ease(d3.easeCubicInOut)
    .call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
}

// Auto-fit after simulation stabilizes
simulation.on('end', () => {
  fitView();
});

// ═══════════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════════
const searchInput = document.getElementById('search-input');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) {
    resetHighlight();
    selectedNode = null;
    closeInfoPanel();
    return;
  }
  const matched = NODES.find(n =>
    n.id.toLowerCase().includes(q) ||
    n.desc.toLowerCase().includes(q) ||
    n.path.toLowerCase().includes(q)
  );
  if (matched) {
    selectedNode = matched.id;
    highlightNode(matched);
    openInfoPanel(matched);
    // pan to node
    if (matched.x !== undefined) {
      const tx = W / 2 - matched.x;
      const ty = H / 2 - matched.y;
      svg.transition().duration(500)
        .call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(1.2));
    }
  }
});

// ═══════════════════════════════════════════════════
// RESIZE
// ═══════════════════════════════════════════════════
window.addEventListener('resize', () => {
  W = wrapper.clientWidth;
  H = wrapper.clientHeight;
  simulation.force('center', d3.forceCenter(W / 2, H / 2));
  simulation.force('x', d3.forceX(W / 2).strength(0.04));
  simulation.force('y', d3.forceY(H / 2).strength(0.04));
  simulation.alpha(0.1).restart();
});

// ═══════════════════════════════════════════════════
// INITIAL POSITIONS (spread by layer for better layout)
// ═══════════════════════════════════════════════════
const layerAngles = {};
LAYERS.forEach((l, i) => {
  layerAngles[l.id] = (2 * Math.PI * i) / LAYERS.length;
});

const SPREAD = 280;
NODES.forEach(n => {
  const angle = layerAngles[n.layer] + (Math.random() - 0.5) * 0.6;
  const r = SPREAD + (Math.random() - 0.5) * 120;
  n.x = W / 2 + r * Math.cos(angle);
  n.y = H / 2 + r * Math.sin(angle);
});

simulation.alpha(1).restart();

// ═══════════════════════════════════════════════════
// ANIMATED entrance
// ═══════════════════════════════════════════════════
nodeGroups
  .style('opacity', 0)
  .transition()
  .duration(600)
  .delay((_, i) => i * 8)
  .style('opacity', 1);

linkEls
  .style('opacity', 0)
  .transition()
  .duration(800)
  .delay(300)
  .style('opacity', 1);

</script>
