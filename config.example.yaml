# J.A.R.V.I.S. Configuration Example
# Copy to ~/.jarvis/config.yaml and customize

daemon:
  port: 3142
  data_dir: "~/.jarvis"
  db_path: "~/.jarvis/jarvis.db"

# Authentication — protects dashboard, API, and WebSocket.
# If unset, the application is open (no auth).
# Can also be set via JARVIS_AUTH_TOKEN env var.
# auth:
#   token: "your-secret-token-here"

llm:
  # Primary provider to use
  primary: "anthropic"

  # Fallback providers (tried in order if primary fails)
  fallback:
    - "openai"
    - "ollama"

  # Anthropic (Claude) configuration
  anthropic:
    api_key: "sk-ant-..."
    model: "claude-sonnet-4-5-20250929"

  # OpenAI (GPT) configuration
  openai:
    api_key: "sk-..."
    model: "gpt-4o"

  # Groq (OpenAI-compatible) configuration
  # groq:
  #   api_key: "gsk_..."
  #   model: "llama-3.3-70b-versatile"

  # OpenRouter (access hundreds of models via single API key)
  # openrouter:
  #   api_key: "sk-or-..."
  #   model: "anthropic/claude-sonnet-4"

  # Ollama (local models) configuration
  ollama:
    base_url: "http://localhost:11434"
    model: "llama3"

personality:
  core_traits:
    - "loyal"
    - "efficient"
    - "proactive"
    - "respectful"
    - "adaptive"

authority:
  # Default authority level (0-5)
  # 0: No permission (ask for everything)
  # 1: Read-only operations
  # 2: Safe modifications
  # 3: Standard operations (default)
  # 4: System changes
  # 5: Full control
  default_level: 3

# Text-to-Speech (voice output)
tts:
  enabled: false
  provider: "edge"            # "edge" (free) or "elevenlabs" (API key required)
  voice: "en-US-AriaNeural"  # Microsoft Edge TTS voice
  rate: "+0%"                 # Speaking rate: "-20%" (slow) to "+30%" (fast)
  volume: "+0%"               # Volume adjustment
  # ElevenLabs (uncomment to use)
  # elevenlabs:
  #   api_key: "sk_..."
  #   voice_id: ""             # Leave empty for default voice, or set a specific voice ID
  #   model: "eleven_flash_v2_5"  # "eleven_flash_v2_5" (fast) or "eleven_multilingual_v2" (quality)
  #   stability: 0.5
  #   similarity_boost: 0.75

# Speech-to-Text (voice input)
# stt:
#   provider: "openai"         # openai, groq, or local
#   openai:
#     api_key: "sk-..."

# Remote hosts reachable over SSH. Each entry becomes a "connection" the
# ssh_run / list_remote_connections tools can target.
#
# Authentication uses the system `ssh` binary, so ~/.ssh/config, ssh-agent,
# known_hosts, and ProxyJump all work as usual. ControlMaster is enabled
# automatically (socket under ~/.ssh/jarvis-cm-*) so subsequent commands reuse
# the same connection.
#
# Every ssh_run call requires user approval (remote_shell is a governed
# category). To exempt specific connections or commands, add a context_rule
# under `authority.context_rules` with condition: tool_name and effect: allow.
#
# remote:
#   connections:
#     homelab:
#       host: 192.168.1.50
#       user: miguel
#       key: ~/.ssh/id_ed25519
#       hypervisor: virtualbox
#       vm_user: miguel              # owner of VBoxManage VMs (it's per-user)
#     freebsd-vm:
#       via: homelab                 # ProxyJump through homelab
#       host: 10.0.0.10
#       user: root

# Active role (must match a filename in roles/ without extension)
active_role: "personal-assistant"
