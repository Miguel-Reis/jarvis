# Compila o PalKeeperMod.dll (mod C++ UE4SS) num runner Windows com MSVC.
# Dispara manualmente ou quando o código do mod muda.
name: palkeeper-mod

on:
  workflow_dispatch:
    inputs:
      ue4ss_repo:
        description: "Repo do UE4SS (fork com suporte Palworld)"
        default: "Okaetsu/RE-UE4SS"
      ue4ss_ref:
        description: "Branch/tag do UE4SS"
        default: "experimental-palworld"
  push:
    paths:
      - "palkeeper-mod/**"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar acesso ao UEPseudo
        shell: bash
        run: |
          # O submódulo deps/first/Unreal (Re-UE4SS/UEPseudo) é PRIVADO por
          # licença da Epic: só contas GitHub ligadas a uma conta Epic Games
          # (acesso ao código-fonte do UE) o conseguem clonar.
          # Cria um PAT (repo read) numa conta com esse acesso e guarda-o no
          # secret UEPSEUDO_TOKEN deste repositório.
          if [ -z "${UEPSEUDO_TOKEN}" ]; then
            echo "::error::Secret UEPSEUDO_TOKEN em falta — necessário para clonar o UEPseudo (privado; requer conta GitHub ligada à Epic Games). Ver palkeeper-mod/README.md."
            exit 1
          fi
        env:
          UEPSEUDO_TOKEN: ${{ secrets.UEPSEUDO_TOKEN }}

      - name: Clonar UE4SS (fork Palworld)
        shell: bash
        run: |
          # submódulos declarados por SSH → HTTPS autenticado com o PAT
          git config --global url."https://x-access-token:${UEPSEUDO_TOKEN}@github.com/".insteadOf "git@github.com:"
          git clone --recursive --depth 1 \
            -b "${{ github.event.inputs.ue4ss_ref || 'experimental-palworld' }}" \
            "https://github.com/${{ github.event.inputs.ue4ss_repo || 'Okaetsu/RE-UE4SS' }}" ue4ss
        env:
          UEPSEUDO_TOKEN: ${{ secrets.UEPSEUDO_TOKEN }}

      - name: Integrar o mod na árvore de cppmods
        shell: bash
        run: |
          mkdir -p ue4ss/cppmods
          cp -r palkeeper-mod ue4ss/cppmods/PalKeeperMod
          echo 'includes("cppmods/PalKeeperMod")' >> ue4ss/xmake.lua

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Compilar
        shell: bash
        working-directory: ue4ss
        run: |
          xmake f -m "Game__Shipping__Win64" -y
          xmake build PalKeeperMod

      - name: Recolher artefactos
        shell: bash
        working-directory: ue4ss
        run: |
          mkdir -p out/PalKeeperMod/dlls
          find . -name "PalKeeperMod.dll" -exec cp {} out/PalKeeperMod/dlls/main.dll \;
          cp cppmods/PalKeeperMod/config/palkeeper-mod.json out/PalKeeperMod/config.json

      - uses: actions/upload-artifact@v4
        with:
          name: PalKeeperMod
          path: ue4ss/out/
